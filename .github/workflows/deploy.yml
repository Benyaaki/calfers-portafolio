name: Desplegar a HostGator

# Cada vez que subes cambios a la rama main, se publican solos en calfers.com
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # también permite lanzarlo a mano desde GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # --- Compilar la web comercial (React/Vite) -> estudio-src/dist ---
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: estudio-src/package-lock.json

      - name: Instalar y compilar la web comercial
        working-directory: estudio-src
        run: |
          npm ci
          npm run build

      # --- 1) Web comercial (build) -> public_html (RAÍZ = página principal) ---
      - name: Subir web comercial (raíz) por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./estudio-src/dist/
          server-dir: ./

      # --- 2) Portafolio (raíz del repo) -> public_html/portafolio ---
      - name: Subir portafolio por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./portafolio/
          # No subir estos (son del proyecto o el código fuente de la comercial):
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/README.md
            **/*.zip
            **/estudio-src/**
            **/deploy-servicios/**

      # --- 3) Limpiar la carpeta huérfana /servicios y dejarla redirigiendo ---
      - name: Limpiar y redirigir /servicios
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-servicios/
          server-dir: ./servicios/
          dangerous-clean-slate: true
